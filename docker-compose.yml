services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-price-alert-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_price_alert}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crypto_price_alert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto} -d ${POSTGRES_DB:-crypto_price_alert}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crypto_price_alert_pgdata:
